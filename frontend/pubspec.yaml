name: acadexa
description: Smart Academic Advisor Powered by AI

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:   
    sdk: flutter           
  intl: ^0.20.2            

  # ── Fonts ────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1          # Cairo (Arabic) + Inter (Latin)

  # ── State management (agnostic — pick one) ──────────────────────────
  flutter_bloc: ^8.1.6          # Option A: Bloc
  # riverpod: ^2.5.1            # Option B: Riverpod
  # provider: ^6.1.2            # Option C: Provider

  # ── Navigation ───────────────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Network / Backend ────────────────────────────────────────────────
  dio: ^5.4.3+1
  supabase_flutter: ^2.5.2
  # retrofit: ^4.1.0            # optional REST code-gen

  # ── Storage ──────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Charts (replace paint-based shells if desired) ───────────────────
  # fl_chart: ^0.67.0
  # syncfusion_flutter_charts: <license required>

  # ── Utilities ────────────────────────────────────────────────────────
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0
  logger: ^2.3.0

  # ── UI extras ────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
  image_picker: ^1.1.2
  pinput: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4
#  bloc_test: ^8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # - assets/icons/
    # - assets/lottie/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo/Cairo-Black.ttf
          weight: 900

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700